name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # git hooks are for local commits only
  HUSKY: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome (format, lint, imports)
        run: pnpm exec biome ci .

      - name: Typecheck tooling
        run: pnpm exec tsc -p tsconfig.json

  test:
    name: Build, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsdown also runs publint and arethetypeswrong on every package
      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck

      # tsdown regenerates each package's `exports`: a diff means a new or
      # removed entry point was not committed
      - name: Check package exports are up to date
        run: git diff --exit-code -- 'packages/*/package.json'

      - name: Test
        run: pnpm exec turbo run test -- --coverage

      - name: Check API reference
        if: matrix.node == 24
        run: pnpm exec typedoc --emit none

      - name: Upload coverage
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/*/coverage
          if-no-files-found: ignore
